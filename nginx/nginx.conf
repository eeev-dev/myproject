server {
    listen 80;

    client_max_body_size 1G;

    location / {
        proxy_pass http://flask:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Не ждать минуту, если Flask упал: через 5 с отдаём «Сервер временно недоступен»
        proxy_connect_timeout 5s;
    }

    # Flask не запущен или не отвечает — отдаём JSON, чтобы приложение показало сообщение
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        charset utf-8;
        return 503 '{"success": false, "message": "Сервер временно недоступен, попробуйте позже"}';
    }
}
